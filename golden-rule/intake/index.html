<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f3eee6">
<meta name="color-scheme" content="light">
<meta name="description" content="Private intake for Golden Rule Home Care &amp; Concierge Services, LLC.">
<title>Golden Rule intake</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f3eee6;
  --card: #fffdfb;
  --ink: #2a241c;
  --muted: #5c534c;
  --faint: #8a7d72;
  --line: #e4d9cc;
  --accent: #7d3b28;
  --accent-ink: #fffaf6;
  --soft: #f6ebe3;
  --ok: #1d6b45;
  --ok-soft: #e7f4ec;
  --danger: #8d2e2e;
  --danger-soft: #fbeeee;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bot: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; }
html { background: var(--bg); color-scheme: light; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background:
    radial-gradient(1200px 500px at 50% -10%, #faf6f0 0%, rgba(250,246,240,0) 70%),
    var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 17px;
  line-height: 1.45;
}
button, input, textarea, select { font-family: inherit; font-size: 17px; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.shell {
  width: min(720px, 100%);
  margin: 0 auto;
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--card);
}
header.top {
  padding: calc(14px + var(--safe-top)) 20px 12px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.brand { min-width: 0; }
.eyebrow {
  margin: 0;
  font-family: var(--serif);
  font-size: 22px;
  letter-spacing: -0.02em;
  line-height: 1.1;
}
.rule {
  width: 36px;
  height: 3px;
  margin: 8px 0 6px;
  border-radius: 2px;
  background: var(--accent);
}
.sub { margin: 0; color: var(--muted); font-size: 14px; }
.linkish {
  border: 0;
  background: transparent;
  color: var(--accent);
  font-weight: 600;
  min-height: 44px;
  padding: 8px 2px;
  text-decoration: underline;
  text-underline-offset: 3px;
}
.progress {
  height: 8px;
  margin: 0 20px;
  background: var(--soft);
  border-radius: 99px;
  overflow: hidden;
}
.progress > span {
  display: block;
  height: 100%;
  width: 0;
  background: var(--accent);
  border-radius: inherit;
}
main {
  flex: 1;
  padding: 18px 20px 12px;
  overflow: auto;
}
.kicker {
  margin: 0 0 8px;
  color: var(--accent);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
h1.prompt, h1.welcome-title {
  margin: 0 0 10px;
  font-family: var(--serif);
  font-weight: 560;
  font-size: clamp(1.7rem, 7vw, 2.15rem);
  line-height: 1.2;
  letter-spacing: -0.02em;
}
.help { margin: 0 0 18px; color: var(--muted); font-size: 16px; }
.welcome p { margin: 0 0 14px; }
.sections {
  margin: 8px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.sections li {
  background: var(--soft);
  border-radius: 12px;
  padding: 10px 12px;
  font-size: 15px;
}
.sections b { color: var(--accent); font-weight: 700; margin-right: 6px; }
label.field, label.stack {
  display: block;
  font-size: 14px;
  font-weight: 650;
  margin: 0 0 6px;
}
input, textarea, select { font-weight: 400; }
input[type="text"], input[type="email"], input[type="tel"], input[type="number"],
input[type="date"], input[type="url"], textarea, select {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: 14px;
  background: #fff;
  margin: 0 0 12px;
}
textarea { min-height: 140px; resize: vertical; line-height: 1.4; }
.choice, .check {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  width: 100%;
  text-align: left;
  min-height: 52px;
  padding: 14px;
  margin: 0 0 10px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: #fff;
}
.choice.on, .check.on { border-color: var(--accent); background: var(--soft); }
.choice { font-weight: 600; }
.check input { width: 22px; height: 22px; margin-top: 1px; flex: none; accent-color: var(--accent); }
.rowcard {
  border: 1.5px solid var(--line);
  border-radius: 16px;
  padding: 12px 12px 4px;
  margin: 0 0 12px;
  background: #fff;
}
.rowhead {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  font-weight: 700;
}
.add {
  width: 100%;
  min-height: 52px;
  border-radius: 14px;
  border: 1.5px dashed var(--accent);
  background: transparent;
  color: var(--accent);
  font-weight: 700;
}
.notsure {
  width: 100%;
  min-height: 52px;
  margin-top: 8px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: #fff;
  font-weight: 650;
}
.note {
  background: var(--soft);
  border-radius: 12px;
  padding: 10px 12px;
  margin: 0 0 12px;
  color: var(--muted);
}
.err {
  background: var(--danger-soft);
  color: var(--danger);
  border-radius: 12px;
  padding: 10px 12px;
  margin: 0 0 12px;
}
footer.nav {
  padding: 12px 20px calc(14px + var(--safe-bot));
  display: flex;
  gap: 10px;
  border-top: 1px solid var(--line);
  background: var(--card);
}
.btn {
  flex: 1;
  min-height: 54px;
  border-radius: 14px;
  border: 1.5px solid var(--line);
  background: #fff;
  font-weight: 700;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: 0.55; }
.review h2 {
  font-family: var(--serif);
  font-size: 1.45rem;
  margin: 22px 0 8px;
}
.item {
  padding: 12px 0;
  border-top: 1px solid var(--line);
}
.item .qlabel { font-weight: 700; margin: 0 0 4px; }
.item .aval { margin: 0; white-space: pre-wrap; }
.item .edit {
  margin-top: 6px;
  min-height: 44px;
  padding: 0;
}
.downloads { display: flex; flex-direction: column; gap: 8px; margin: 8px 0 16px; }
.downloads .btn { flex: none; }
.success-mark {
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--ok-soft); color: var(--ok);
  display: grid; place-items: center;
  font-size: 28px; margin-bottom: 12px;
}
.hp {
  position: absolute;
  left: -10000px;
  width: 1px;
  height: 1px;
  overflow: hidden;
}
@media (min-width: 840px) {
  body { padding: 28px 16px 40px; }
  .shell {
    min-height: calc(100dvh - 68px);
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(70, 42, 24, 0.08);
  }
  .sections { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 420px) {
  header.top, main, footer.nav { padding-left: 16px; padding-right: 16px; }
  .progress { margin-left: 16px; margin-right: 16px; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand">
      <p class="eyebrow">Golden Rule</p>
      <div class="rule"></div>
      <p class="sub">Home Care &amp; Concierge Services</p>
    </div>
    <button type="button" class="linkish" id="restart" hidden>Start over</button>
  </header>
  <div class="progress" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress">
    <span id="progress-bar"></span>
  </div>
  <main id="main"></main>
  <footer class="nav" id="nav"></footer>
</div>
<div class="hp" aria-hidden="true">
  <label for="company-website">Company website</label>
  <input id="company-website" name="_honey" tabindex="-1" autocomplete="off">
</div>
<script>
(function () {
  "use strict";

  // FormSubmit hashed alias. The inbox address stays off this page.
  var FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/aef32fbab4f0a981bae1a0278e59dbbe";
  var STORE_KEY = "gr.hccs.intake.v1";

  // FormSubmit's table lists one row per field name. JSON key order is not
  // guaranteed in that table, and an alphabetical sort is the safe assumption.
  // Keys are "01 Business. 01 What is the legal business name?" so both
  // alphabetical order and insertion order follow section, then question.
  // Fields that start with _ are FormSubmit controls and are left out of the table.
  // FormSubmit does not publish a per-field character cap. The documented
  // constraint that applies here is the size of the whole request (about 1 MB).
  // Answers are copied in full. Nothing in this file slices a textarea.

  var data = null;
  var state = {
    version: 1,
    mode: "welcome",
    questionId: null,
    fromReview: false,
    editSnapshot: null,
    answers: {},
    submitted: false,
    dirty: false,
    sending: false
  };

  var main = document.getElementById("main");
  var nav = document.getElementById("nav");
  var restart = document.getElementById("restart");

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function questions() { return data.questions; }
  function sections() { return data.sections; }
  function sectionById(id) {
    for (var i = 0; i < data.sections.length; i++) if (data.sections[i].id === id) return data.sections[i];
    return { id: id, label: id };
  }
  function sectionIndex(id) {
    for (var i = 0; i < data.sections.length; i++) if (data.sections[i].id === id) return i;
    return 0;
  }
  function qIndex(id) {
    var list = questions();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return i;
    return -1;
  }
  function questionById(id) {
    var list = questions();
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function questionsIn(sectionId) {
    return questions().filter(function (q) { return q.section === sectionId; });
  }
  function currentQ() { return questionById(state.questionId); }

  function formatMDY(v) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || "").trim());
    if (!m) return String(v || "").trim();
    return m[2] + "/" + m[3] + "/" + m[1];
  }

  function fillTemplate(template, row) {
    var out = String(template).replace(/\{([A-Za-z0-9_]+)(?::([A-Za-z]+))?\}/g, function (_, key, kind) {
      var v = row && row[key] != null ? String(row[key]).trim() : "";
      if (!v) return "\u0000";
      if (kind === "date") return formatMDY(v);
      return v;
    });
    var parts = out.split("\u0000").map(function (s) {
      return s.replace(/^[\s,]+|[\s,]+$/g, "").replace(/\s{2,}/g, " ");
    }).filter(Boolean);
    out = parts.join(", ");
    out = out.replace(/,\s*starts$/i, "").replace(/\s+to\s*$/i, "").replace(/^[,\s]+|[,\s]+$/g, "").trim();
    return out;
  }

  function rowLine(q, row) {
    if (q.id === "office_hours" && /^closed$/i.test(String(row.opens || "").trim())) {
      var day = String(row.day || "").trim();
      return day ? day + ", Closed" : "Closed";
    }
    if (q.line) return fillTemplate(q.line, row);
    return (q.columns || []).map(function (c) {
      return String(row[c.key] || "").trim();
    }).filter(Boolean).join(", ");
  }

  function choiceLabel(q, id) {
    if (id === "__other__") return q.otherLabel || "Other";
    var opts = q.options || [];
    for (var i = 0; i < opts.length; i++) if (opts[i].id === id) return opts[i].label;
    return id;
  }

  function formatAnswer(q, a) {
    if (a && a.notSure) return "Not sure yet";
    var text = "";
    if (!a) return "(left blank)";
    if (q.type === "single") {
      if (!a.choice) return "(left blank)";
      var label = choiceLabel(q, a.choice);
      var extra = String(a.other || "").trim();
      text = a.choice === "__other__" && extra ? label + ": " + extra : label;
    } else if (q.type === "multi") {
      var selected = a.selected || [];
      if (!selected.length) return "(left blank)";
      var parts = [];
      selected.forEach(function (id) {
        if (id === "__other__") return;
        parts.push(choiceLabel(q, id));
      });
      if (selected.indexOf("__other__") !== -1) {
        var other = String(a.other || "").trim();
        parts.push(other ? "Other: " + other : "Other");
      }
      text = parts.join(", ");
    } else if (q.type === "rows") {
      var lines = (a.rows || []).map(function (row) { return rowLine(q, row); }).filter(Boolean);
      if (!lines.length) return "(left blank)";
      text = lines.length === 1 ? lines[0] : lines.map(function (line, i) { return (i + 1) + ". " + line; }).join("\n");
    } else if (q.type === "fields") {
      var values = a.values || {};
      if (q.line) text = fillTemplate(q.line, values);
      else {
        text = (q.fields || []).map(function (f) {
          var v = String(values[f.key] || "").trim();
          return v ? f.label + ": " + v : "";
        }).filter(Boolean).join(", ");
      }
    } else {
      text = String(a.value || "").trim();
    }
    return text ? text : "(left blank)";
  }

  function emailKey(q) {
    var sec = sectionById(q.section);
    var sIdx = sectionIndex(q.section) + 1;
    var inSec = questionsIn(q.section);
    var qIdx = 1;
    for (var i = 0; i < inSec.length; i++) if (inSec[i].id === q.id) qIdx = i + 1;
    return pad(sIdx) + " " + sec.label + ". " + pad(qIdx) + " " + q.prompt;
  }

  function businessName() {
    var q = questionById("legal_name");
    if (!q) return "Golden Rule";
    var text = formatAnswer(q, state.answers.legal_name);
    if (!text || text === "Not sure yet" || text === "(left blank)") return "Golden Rule";
    return text;
  }

  function replyEmail() {
    var q = questionById("email");
    if (!q) return "";
    var text = formatAnswer(q, state.answers.email);
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(text)) return "";
    return text;
  }

  function buildPayload() {
    var payload = {};
    sections().forEach(function (sec) {
      questionsIn(sec.id).forEach(function (q) {
        var value = formatAnswer(q, state.answers[q.id]);
        if (typeof value !== "string" || !value.trim()) value = "(left blank)";
        if (value.indexOf("[object Object]") !== -1) {
          throw new Error("Unreadable answer for " + q.id);
        }
        payload[emailKey(q)] = value;
      });
    });
    payload._subject = "Golden Rule intake: " + businessName();
    payload._template = "table";
    payload._captcha = "false";
    var honey = document.getElementById("company-website");
    payload._honey = honey ? honey.value : "";
    var reply = replyEmail();
    if (reply) payload._replyto = reply;
    return payload;
  }

  function buildJsonExport() {
    return {
      business: data.meta.business,
      exportedAt: new Date().toISOString(),
      sections: sections().map(function (sec) {
        return {
          id: sec.id,
          label: sec.label,
          questions: questionsIn(sec.id).map(function (q) {
            return {
              id: q.id,
              prompt: q.prompt,
              maps_to: q.maps_to,
              answer: formatAnswer(q, state.answers[q.id]),
              raw: state.answers[q.id] || null
            };
          })
        };
      })
    };
  }

  function readableHtml() {
    var when = new Date().toLocaleString("en-US", { dateStyle: "long", timeStyle: "short" });
    var body = sections().map(function (sec) {
      var items = questionsIn(sec.id).map(function (q) {
        return "<div class=\"q\"><h3>" + esc(q.prompt) + "</h3><p>" + esc(formatAnswer(q, state.answers[q.id])) + "</p></div>";
      }).join("");
      return "<section><h2>" + esc(sec.label) + "</h2>" + items + "</section>";
    }).join("");
    return "<!DOCTYPE html><html lang=\"en\"><head><meta charset=\"utf-8\">" +
      "<meta name=\"robots\" content=\"noindex\">" +
      "<title>Golden Rule intake answers</title>" +
      "<style>body{margin:0;background:#f3eee6;color:#2a241c;font-family:Georgia,serif}" +
      "main{max-width:40rem;margin:0 auto;padding:32px 20px 64px}" +
      "h1{font-weight:500;font-size:2rem;margin:0 0 8px}h2{margin:28px 0 8px;font-size:1.4rem}" +
      ".q{margin:0 0 16px}.q h3{font-family:\"Segoe UI\",sans-serif;font-size:1rem;margin:0 0 4px}" +
      ".q p{margin:0;white-space:pre-wrap;font-size:1.05rem}.meta{color:#5c534c}</style></head><body><main>" +
      "<p class=\"meta\">" + esc(data.meta.business) + "</p>" +
      "<h1>Intake answers</h1><p class=\"meta\">" + esc(when) + "</p>" + body + "</main></body></html>";
  }

  function download(filename, mime, text) {
    var blob = new Blob([text], { type: mime });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1500);
  }

  function save() {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        version: 1,
        mode: state.mode,
        questionId: state.questionId,
        fromReview: state.fromReview,
        editSnapshot: state.editSnapshot,
        answers: state.answers,
        submitted: state.submitted
      }));
    } catch (e) {}
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (!raw) return;
      var saved = JSON.parse(raw);
      if (!saved || saved.version !== 1) return;
      state.mode = saved.mode || "welcome";
      state.questionId = saved.questionId || null;
      state.fromReview = !!saved.fromReview;
      state.editSnapshot = saved.editSnapshot || null;
      state.answers = saved.answers || {};
      state.submitted = !!saved.submitted;
      if (state.submitted) state.mode = "success";
      if (state.mode === "question" && !questionById(state.questionId)) {
        state.mode = "welcome";
        state.questionId = null;
      }
    } catch (e) {}
  }

  function hasProgress() {
    return state.mode !== "welcome" || Object.keys(state.answers).length > 0 || state.submitted;
  }

  function setProgress() {
    var pct = 0;
    if (state.mode === "welcome") pct = 0;
    else if (state.mode === "review" || state.mode === "success" || state.mode === "failure") pct = 100;
    else {
      var idx = qIndex(state.questionId);
      pct = Math.round(((idx + 1) / questions().length) * 100);
    }
    document.getElementById("progress-bar").style.width = pct + "%";
    var bar = document.getElementById("progress");
    bar.setAttribute("aria-valuenow", String(pct));
  }

  function showError(msg) {
    var old = document.getElementById("form-error");
    if (old) old.remove();
    var div = document.createElement("div");
    div.className = "err";
    div.id = "form-error";
    div.setAttribute("role", "alert");
    div.textContent = msg;
    main.insertBefore(div, main.firstChild);
    div.scrollIntoView({ block: "nearest" });
  }

  function readDom(q) {
    if (q.type === "single") {
      var on = main.querySelector(".choice.on");
      return { choice: on ? on.getAttribute("data-option") : "", other: valueOf("#other-text") };
    }
    if (q.type === "multi") {
      var selected = [];
      main.querySelectorAll(".check input:checked").forEach(function (box) { selected.push(box.value); });
      return { selected: selected, other: valueOf("#other-text") };
    }
    if (q.type === "rows") {
      var rows = [];
      main.querySelectorAll(".rowcard").forEach(function (card) {
        var row = {};
        card.querySelectorAll("[data-key]").forEach(function (el) { row[el.getAttribute("data-key")] = el.value; });
        rows.push(row);
      });
      return { rows: rows };
    }
    if (q.type === "fields") {
      var values = {};
      main.querySelectorAll("[data-key]").forEach(function (el) { values[el.getAttribute("data-key")] = el.value; });
      return { values: values };
    }
    return { value: valueOf("#answer") };
  }

  function valueOf(sel) {
    var el = main.querySelector(sel);
    return el ? el.value : "";
  }

  function validate(q, a) {
    if (a && a.notSure) return "";
    var need = "Add an answer, or tap Not sure yet.";
    if (!q.required && isEmptyAnswer(q, a)) return "";
    if (!a || isEmptyAnswer(q, a)) return q.required ? need : "";
    if (q.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(a.value).trim())) return "Check that email and try again, or tap Not sure yet.";
    if (q.type === "tel" && String(a.value).replace(/\D/g, "").length < 10) return "Include the area code, or tap Not sure yet.";
    if (q.type === "number") {
      var n = Number(a.value);
      if (!isFinite(n)) return "Enter a number, or tap Not sure yet.";
      if (q.min != null && n < q.min) return "That number looks too small. Check it, or tap Not sure yet.";
      if (q.max != null && n > q.max) return "That number looks too large. Check it, or tap Not sure yet.";
    }
    if (q.id === "zip" && !/^\d{5}(-\d{4})?$/.test(String(a.value).trim())) return "Use a 5 digit ZIP, or tap Not sure yet.";
    if (q.type === "single" && a.choice === "__other__" && !String(a.other || "").trim()) return "Add a short note, or tap Not sure yet.";
    if (q.type === "multi" && (a.selected || []).indexOf("__other__") !== -1 && !String(a.other || "").trim()) return "Add the other item, or tap Not sure yet.";
    if (q.type === "fields") {
      var values = a.values || {};
      for (var i = 0; i < q.fields.length; i++) {
        var fv = String(values[q.fields[i].key] || "").trim();
        if (!fv) return "Fill in each line, or tap Not sure yet.";
        if (q.fields[i].type === "tel" && fv.replace(/\D/g, "").length < 10) return "Include the area code, or tap Not sure yet.";
      }
    }
    if (q.type === "rows") {
      var rows = a.rows || [];
      var keys = q.rowRequired || [];
      var any = false;
      for (var r = 0; r < rows.length; r++) {
        var row = rows[r];
        if (q.id === "office_hours") {
          if (!String(row.opens || "").trim()) return "Fill in every day, or tap Not sure yet. Write Closed if the office is shut.";
          if (!/^closed$/i.test(String(row.opens).trim())) {
            if (!String(row.closes || "").trim() || !String(row.who || "").trim()) return "Add a closing time and who covers, or write Closed for the day.";
          }
          any = true;
          continue;
        }
        var touched = false;
        (q.columns || []).forEach(function (c) {
          if (!c.readOnly && String(row[c.key] || "").trim()) touched = true;
        });
        if (!touched && !q.requireAllRows) continue;
        any = true;
        for (var k = 0; k < keys.length; k++) {
          if (!String(row[keys[k]] || "").trim()) return "Fill in each open line, or tap Not sure yet.";
        }
      }
      if (q.required && !any) return "Add at least one row, or tap Not sure yet.";
    }
    return "";
  }

  function isEmptyAnswer(q, a) {
    return formatAnswer(q, a) === "(left blank)";
  }

  function syncFromDom() {
    var q = currentQ();
    if (!q || state.mode !== "question") return;
    var prev = state.answers[q.id];
    if (prev && prev.notSure && !state.dirty) return;
    state.answers[q.id] = readDom(q);
  }

  function render() {
    state.dirty = false;
    restart.hidden = !hasProgress();
    setProgress();
    main.innerHTML = "";
    nav.innerHTML = "";
    if (!data) {
      main.innerHTML = "<p>Loading your questions...</p>";
      return;
    }
    if (state.mode === "welcome") renderWelcome();
    else if (state.mode === "question") renderQuestion();
    else if (state.mode === "review") renderReview();
    else if (state.mode === "success") renderDone(true);
    else if (state.mode === "failure") renderDone(false);
    var heading = main.querySelector("h1");
    if (heading) { heading.setAttribute("tabindex", "-1"); heading.focus(); }
    main.scrollTop = 0;
  }

  function renderWelcome() {
    var mins = data.meta.estimatedMinutes;
    var back = Object.keys(state.answers).length > 0 && !state.submitted;
    main.innerHTML =
      "<h1 class=\"welcome-title\">A few questions for your KDHE papers</h1>" +
      "<div class=\"welcome\">" +
      "<p>This is for you, Taylor. It collects the facts for your KDHE Non-Medical Supportive Care agency documents. The business is " + esc(data.meta.business) + ".</p>" +
      "<p>About " + esc(mins) + " minutes. There are " + sections().length + " sections, and each screen is one question, so it does not all land at once.</p>" +
      "<p>You can stop whenever you need to. Your answers stay on this phone or computer, and you can come back to the same place.</p>" +
      "<p>Nothing is sent until you reach the end and choose to send.</p>" +
      "<p>If you do not know an answer, tap Not sure yet. Please do not guess, and please do not write N/A.</p>" +
      "</div>" +
      "<ol class=\"sections\">" + sections().map(function (s, i) {
        return "<li><b>" + pad(i + 1) + "</b>" + esc(s.label) + "</li>";
      }).join("") + "</ol>";
    if (back) {
      var note = document.createElement("p");
      note.className = "note";
      note.textContent = "Welcome back. Your saved answers are on this device.";
      main.insertBefore(note, main.firstChild);
    }
    nav.appendChild(button(back ? "Continue" : "Begin", "primary", "btn-next", goNext));
  }

  function renderQuestion() {
    var q = currentQ();
    var sec = sectionById(q.section);
    var idx = qIndex(q.id);
    var inSec = questionsIn(q.section);
    var local = 1;
    for (var i = 0; i < inSec.length; i++) if (inSec[i].id === q.id) local = i + 1;
    main.innerHTML =
      "<p class=\"kicker\">" + esc(sec.label) + ", question " + (idx + 1) + " of " + questions().length + "</p>" +
      "<h1 class=\"prompt\" data-qid=\"" + esc(q.id) + "\">" + esc(q.prompt) + "</h1>" +
      (q.help ? "<p class=\"help\">" + esc(q.help) + "</p>" : "");
    main.setAttribute("data-qid", q.id);
    main.setAttribute("data-type", q.type);
    var a = state.answers[q.id];
    if (a && a.notSure) {
      var note = document.createElement("p");
      note.className = "note";
      note.textContent = "Marked as Not sure yet. Type an answer to replace that, or continue to keep it.";
      main.appendChild(note);
    }
    renderInput(q, a && a.notSure ? null : a);
    if (q.notSure !== false) {
      var ns = button("Not sure yet", "", "btn-not-sure", function () {
        state.answers[q.id] = { notSure: true };
        state.dirty = false;
        advance(true);
      });
      ns.classList.add("notsure");
      main.appendChild(ns);
    }
    if (idx > 0 || state.fromReview) nav.appendChild(button(state.fromReview ? "Cancel" : "Back", "", "btn-back", goBack));
    var nextLabel = state.fromReview ? "Back to review" : (idx === questions().length - 1 ? "Review" : "Next");
    nav.appendChild(button(nextLabel, "primary", "btn-next", goNext));
  }

  function renderInput(q, a) {
    if (q.type === "textarea") main.appendChild(area(q, a));
    else if (q.type === "single") renderSingle(q, a);
    else if (q.type === "multi") renderMulti(q, a);
    else if (q.type === "rows") renderRows(q, a);
    else if (q.type === "fields") renderFields(q, a);
    else main.appendChild(simpleInput(q, a));
  }

  function simpleInput(q, a) {
    var input = document.createElement("input");
    input.id = "answer";
    input.type = q.type === "text" ? "text" : q.type;
    if (q.type === "zip") input.type = "text";
    input.value = a && a.value ? a.value : "";
    input.placeholder = q.placeholder || "";
    input.autocomplete = q.autocomplete || "off";
    if (q.type === "number") input.inputMode = "decimal";
    if (q.type === "tel") input.inputMode = "tel";
    if (q.inputMode) input.inputMode = q.inputMode;
    if (q.maxlength) input.maxLength = q.maxlength;
    input.addEventListener("input", markDirty);
    return input;
  }

  function area(q, a) {
    var input = document.createElement("textarea");
    input.id = "answer";
    input.placeholder = q.placeholder || "";
    input.maxLength = q.maxlength || 20000;
    input.value = a && a.value ? a.value : "";
    input.addEventListener("input", markDirty);
    return input;
  }

  function renderSingle(q, a) {
    (q.options || []).forEach(function (opt) { main.appendChild(choiceButton(opt.id, opt.label, a && a.choice === opt.id)); });
    if (q.allowOther) {
      main.appendChild(choiceButton("__other__", q.otherLabel || "Other", a && a.choice === "__other__"));
      main.appendChild(otherBox(a && a.choice === "__other__", a));
    }
  }

  function renderMulti(q, a) {
    var selected = (a && a.selected) || [];
    (q.options || []).forEach(function (opt) { main.appendChild(checkRow(opt.id, opt.label, selected.indexOf(opt.id) !== -1)); });
    if (q.allowOther) {
      main.appendChild(checkRow("__other__", q.otherLabel || "Other", selected.indexOf("__other__") !== -1));
      main.appendChild(otherBox(selected.indexOf("__other__") !== -1, a));
    }
  }

  function choiceButton(id, label, on) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "choice" + (on ? " on" : "");
    btn.setAttribute("data-option", id);
    btn.setAttribute("role", "radio");
    btn.setAttribute("aria-checked", on ? "true" : "false");
    btn.textContent = label;
    btn.addEventListener("click", function () {
      markDirty();
      main.querySelectorAll(".choice").forEach(function (el) {
        var hit = el.getAttribute("data-option") === id;
        el.classList.toggle("on", hit);
        el.setAttribute("aria-checked", hit ? "true" : "false");
      });
      var box = document.getElementById("other-text");
      if (box) {
        box.hidden = id !== "__other__";
        if (id === "__other__") box.focus();
      }
      state.answers[currentQ().id] = readDom(currentQ());
      save();
    });
    return btn;
  }

  function checkRow(id, label, on) {
    var lab = document.createElement("label");
    lab.className = "check" + (on ? " on" : "");
    var input = document.createElement("input");
    input.type = "checkbox";
    input.value = id;
    input.checked = !!on;
    var span = document.createElement("span");
    span.textContent = label;
    input.addEventListener("change", function () {
      markDirty();
      lab.classList.toggle("on", input.checked);
      var box = document.getElementById("other-text");
      if (id === "__other__" && box) {
        box.hidden = !input.checked;
        if (input.checked) box.focus();
      }
      state.answers[currentQ().id] = readDom(currentQ());
      save();
    });
    lab.appendChild(input);
    lab.appendChild(span);
    return lab;
  }

  function otherBox(show, a) {
    var input = document.createElement("input");
    input.type = "text";
    input.id = "other-text";
    input.placeholder = "Tell us a bit more";
    input.hidden = !show;
    input.value = a && a.other ? a.other : "";
    input.addEventListener("input", function () {
      markDirty();
      state.answers[currentQ().id] = readDom(currentQ());
      save();
    });
    return input;
  }

  function renderRows(q, a) {
    var rows = (a && a.rows && a.rows.length) ? a.rows : seedRows(q);
    rows.forEach(function (row, i) { main.appendChild(rowCard(q, row, i)); });
    var add = document.createElement("button");
    add.type = "button";
    add.className = "add";
    add.id = "btn-add-row";
    add.textContent = q.addLabel || "Add another";
    add.addEventListener("click", function () {
      var next = readDom(q);
      var blank = {};
      (q.columns || []).forEach(function (c) { blank[c.key] = ""; });
      next.rows.push(blank);
      state.answers[q.id] = next;
      state.dirty = true;
      save();
      render();
    });
    main.appendChild(add);
  }

  function seedRows(q) {
    if (q.seed && q.seed.length) return q.seed.map(function (row) { return Object.assign({}, row); });
    var blank = {};
    (q.columns || []).forEach(function (c) { blank[c.key] = ""; });
    return [blank];
  }

  function rowCard(q, row, index) {
    var card = document.createElement("div");
    card.className = "rowcard";
    var head = document.createElement("div");
    head.className = "rowhead";
    var title = document.createElement("span");
    title.textContent = "Row " + (index + 1);
    var remove = document.createElement("button");
    remove.type = "button";
    remove.className = "linkish";
    remove.textContent = "Remove";
    remove.addEventListener("click", function () {
      var next = readDom(q);
      next.rows.splice(index, 1);
      if (!next.rows.length) next.rows = seedRows(q).slice(0, 1);
      state.answers[q.id] = next;
      state.dirty = true;
      save();
      render();
    });
    head.appendChild(title);
    head.appendChild(remove);
    card.appendChild(head);
    (q.columns || []).forEach(function (c) { card.appendChild(columnInput(c, row)); });
    return card;
  }

  function columnInput(c, row) {
    var wrap = document.createElement("label");
    wrap.className = "stack";
    var span = document.createElement("span");
    span.textContent = c.label;
    wrap.appendChild(span);
    var el;
    if (c.type === "select") {
      el = document.createElement("select");
      var empty = document.createElement("option");
      empty.value = "";
      empty.textContent = "Choose";
      el.appendChild(empty);
      (c.options || []).forEach(function (opt) {
        var o = document.createElement("option");
        o.value = opt;
        o.textContent = opt;
        el.appendChild(o);
      });
    } else {
      el = document.createElement("input");
      el.type = c.type || "text";
    }
    el.setAttribute("data-key", c.key);
    el.value = row && row[c.key] ? row[c.key] : "";
    if (c.placeholder) el.placeholder = c.placeholder;
    el.addEventListener("input", function () {
      markDirty();
      state.answers[currentQ().id] = readDom(currentQ());
      save();
    });
    wrap.appendChild(el);
    return wrap;
  }

  function renderFields(q, a) {
    var values = (a && a.values) || {};
    (q.fields || []).forEach(function (f) {
      var wrap = document.createElement("label");
      wrap.className = "field";
      wrap.textContent = f.label;
      var input = document.createElement("input");
      input.type = f.type || "text";
      input.setAttribute("data-key", f.key);
      input.placeholder = f.placeholder || "";
      input.value = values[f.key] || "";
      input.addEventListener("input", function () {
        markDirty();
        state.answers[currentQ().id] = readDom(currentQ());
        save();
      });
      wrap.appendChild(input);
      main.appendChild(wrap);
    });
  }

  function renderReview() {
    var html = "<h1 class=\"prompt\">Review your answers</h1>" +
      "<p class=\"help\">Here is everything you entered. Tap Edit on any line to change it. Then send, and keep a copy for yourself.</p>" +
      "<div class=\"downloads\">" +
      "<button type=\"button\" class=\"btn\" id=\"btn-download\">Download my answers</button>" +
      "<button type=\"button\" class=\"btn\" id=\"btn-download-json\">Download JSON</button>" +
      "</div>";
    sections().forEach(function (sec) {
      html += "<section class=\"review\"><h2>" + esc(sec.label) + "</h2>";
      questionsIn(sec.id).forEach(function (q) {
        html += "<div class=\"item\"><p class=\"qlabel\">" + esc(q.prompt) + "</p><p class=\"aval\">" +
          esc(formatAnswer(q, state.answers[q.id])) + "</p>" +
          "<button type=\"button\" class=\"linkish edit\" data-edit=\"" + esc(q.id) + "\">Edit</button></div>";
      });
      html += "</section>";
    });
    main.innerHTML = html;
    document.getElementById("btn-download").addEventListener("click", function () {
      download("golden-rule-intake-answers.html", "text/html", readableHtml());
    });
    document.getElementById("btn-download-json").addEventListener("click", function () {
      download("golden-rule-intake-answers.json", "application/json", JSON.stringify(buildJsonExport(), null, 2));
    });
    main.querySelectorAll("[data-edit]").forEach(function (btn) {
      btn.addEventListener("click", function () { editQuestion(btn.getAttribute("data-edit")); });
    });
    nav.appendChild(button("Back", "", "btn-back", function () {
      state.mode = "question";
      state.questionId = questions()[questions().length - 1].id;
      state.fromReview = false;
      save();
      render();
    }));
    nav.appendChild(button("Send my answers", "primary", "btn-send", sendAnswers));
  }

  function renderDone(ok) {
    if (ok) {
      main.innerHTML = "<div class=\"success-mark\" aria-hidden=\"true\">&#10003;</div>" +
        "<h1 class=\"prompt\">Your answers were sent</h1>" +
        "<p class=\"help\">Thank you. They are on the way, and a copy can stay with you too. You can close this page whenever you are ready.</p>";
    } else {
      main.innerHTML = "<h1 class=\"prompt\">Those answers did not send</h1>" +
        "<p class=\"help\">They are still saved on this device. Check your connection, then try again. You can also download a copy right now.</p>";
    }
    var box = document.createElement("div");
    box.className = "downloads";
    var htmlBtn = button("Download my answers", "", "btn-download", function () {
      download("golden-rule-intake-answers.html", "text/html", readableHtml());
    });
    var jsonBtn = button("Download JSON", "", "btn-download-json", function () {
      download("golden-rule-intake-answers.json", "application/json", JSON.stringify(buildJsonExport(), null, 2));
    });
    box.appendChild(htmlBtn);
    box.appendChild(jsonBtn);
    main.appendChild(box);
    if (!ok) nav.appendChild(button(state.sending ? "Sending..." : "Try again", "primary", "btn-send", sendAnswers));
  }

  function button(label, kind, id, fn) {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "btn" + (kind ? " " + kind : "");
    btn.id = id;
    btn.textContent = label;
    btn.addEventListener("click", fn);
    return btn;
  }

  function markDirty() { state.dirty = true; }

  function goNext() {
    if (state.mode === "welcome") {
      state.mode = "question";
      state.questionId = state.questionId && questionById(state.questionId) ? state.questionId : questions()[0].id;
      if (!questionById(state.questionId)) state.questionId = questions()[0].id;
      state.fromReview = false;
      save();
      render();
      return;
    }
    advance(false);
  }

  function advance(force) {
    if (state.mode !== "question") return;
    var q = currentQ();
    if (!force) syncFromDom();
    var err = validate(q, state.answers[q.id]);
    if (err) { showError(err); return; }
    save();
    if (state.fromReview) {
      state.mode = "review";
      state.fromReview = false;
      state.editSnapshot = null;
      save();
      render();
      return;
    }
    var idx = qIndex(q.id);
    if (idx >= questions().length - 1) state.mode = "review";
    else state.questionId = questions()[idx + 1].id;
    save();
    render();
  }

  function goBack() {
    if (state.fromReview) {
      if (state.editSnapshot) state.answers[state.questionId] = state.editSnapshot;
      else delete state.answers[state.questionId];
      state.mode = "review";
      state.fromReview = false;
      state.editSnapshot = null;
      save();
      render();
      return;
    }
    syncFromDom();
    save();
    var idx = qIndex(state.questionId);
    if (idx <= 0) state.mode = "welcome";
    else state.questionId = questions()[idx - 1].id;
    save();
    render();
  }

  function editQuestion(id) {
    state.editSnapshot = JSON.parse(JSON.stringify(state.answers[id] || null));
    state.fromReview = true;
    state.mode = "question";
    state.questionId = id;
    save();
    render();
  }

  function firstGap() {
    var list = questions();
    for (var i = 0; i < list.length; i++) {
      if (validate(list[i], state.answers[list[i].id])) return list[i].id;
    }
    return "";
  }

  function formAccepted(parsed) {
    if (!parsed) return false;
    var flag = parsed.success;
    if (flag === true || flag === "true") return true;
    if (flag === false || flag === "false") return false;
    return false;
  }

  async function sendAnswers() {
    if (state.sending || state.submitted) return;
    var gap = firstGap();
    if (gap) {
      state.mode = "question";
      state.questionId = gap;
      state.fromReview = true;
      save();
      render();
      showError("This one still needs an answer, or Not sure yet.");
      return;
    }
    var payload;
    try { payload = buildPayload(); }
    catch (err) {
      state.mode = "failure";
      save();
      render();
      return;
    }
    if (payload._honey) {
      state.mode = "success";
      state.submitted = true;
      state.sending = false;
      save();
      render();
      return;
    }
    state.sending = true;
    var sendBtn = document.getElementById("btn-send");
    if (sendBtn) { sendBtn.disabled = true; sendBtn.textContent = "Sending..."; }
    try {
      var res = await fetch(FORMSUBMIT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify(payload)
      });
      var text = await res.text();
      var parsed = null;
      try { parsed = JSON.parse(text); } catch (e) { parsed = null; }
      var ok = res.ok && formAccepted(parsed);
      state.sending = false;
      state.mode = ok ? "success" : "failure";
      if (ok) state.submitted = true;
      save();
      render();
    } catch (err) {
      state.sending = false;
      state.mode = "failure";
      save();
      render();
    }
  }

  function startOver() {
    if (!window.confirm("Start over? This clears the answers saved on this device.")) return;
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    state.mode = "welcome";
    state.questionId = null;
    state.fromReview = false;
    state.editSnapshot = null;
    state.answers = {};
    state.submitted = false;
    state.sending = false;
    render();
  }

  document.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" || e.shiftKey || e.altKey || e.isComposing) return;
    var tag = e.target && e.target.tagName;
    if (tag === "TEXTAREA") {
      if (e.metaKey || e.ctrlKey) { e.preventDefault(); goNext(); }
      return;
    }
    if (tag === "BUTTON" || tag === "A" || tag === "SELECT") return;
    if (tag === "INPUT" && e.target.type === "checkbox") return;
    if (state.mode === "welcome" || state.mode === "question") {
      e.preventDefault();
      goNext();
    }
  });

  restart.addEventListener("click", startOver);

  main.innerHTML = "<p class=\"help\">Loading your questions...</p>";

  if (location.pathname.endsWith("/intake")) {
    location.replace(location.pathname + "/" + location.search + location.hash);
    return;
  }

  fetch("questions.json", { cache: "no-store" }).then(function (res) {
    if (!res.ok) throw new Error("missing");
    return res.json();
  }).then(function (json) {
    data = json;
    loadState();
    render();
    if ("serviceWorker" in navigator && location.protocol !== "file:") {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  }).catch(function () {
    main.innerHTML = "<h1 class=\"prompt\">The questions did not load</h1><p class=\"help\">Check your connection and refresh this page.</p>";
  });

  window.GR = {
    endpoint: FORMSUBMIT_ENDPOINT,
    formatAnswer: formatAnswer,
    buildPayload: buildPayload,
    readableHtml: readableHtml,
    getState: function () { return state; },
    getData: function () { return data; }
  };
})();
</script>
</body>
</html>
